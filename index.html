<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12col</title>
<meta name="description" content="Make column and row grid guides for any canvas size and export them as a PNG or SVG.">
<link rel="canonical" href="https://12col.xyz/">
<meta property="og:title" content="12col">
<meta property="og:description" content="Make column and row grid guides for any canvas size and export them as a PNG or SVG.">
<meta property="og:url" content="https://12col.xyz/">
<style>
  :root {
    --panel: #ffffff;
    --canvas-bg: #e8e8e8;
    --line: #e3e3e3;
    --field-line: #d4d4d4;
    --text: #222;
    --muted: #8c8c8c;
    --accent: #2f6fec;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 12px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--canvas-bg);
    display: flex;
  }

  /* ---------- panel ---------- */
  aside {
    width: 248px;
    flex: none;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .title {
    font-size: 12px; font-weight: 600;
    height: 41px; flex: none; padding: 0 14px;
    display: flex; align-items: center;
    border-bottom: 1px solid var(--line);
  }
  section {
    padding: 12px 14px 14px;
    border-bottom: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 8px;
  }
  .head {
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 600; height: 20px;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

  /* text field with a small inline label */
  .input {
    display: flex; align-items: center;
    height: 28px;
    border: 1px solid var(--field-line);
    border-radius: 4px;
    background: #fff;
    min-width: 0;
  }
  .input:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .input > span {
    flex: none; padding-left: 7px;
    color: var(--muted); font-size: 11px;
    user-select: none;
  }
  .input input {
    flex: 1; min-width: 0; width: 100%; height: 100%;
    border: 0; outline: 0; background: transparent;
    font: inherit; color: var(--text);
    padding: 0 6px;
    font-variant-numeric: tabular-nums;
  }
  .input .suffix { padding: 0 7px 0 0; }

  select {
    width: 100%; height: 28px; min-width: 0;
    font: inherit; color: var(--text);
    border: 1px solid var(--field-line); border-radius: 4px;
    background: #fff; padding: 0 6px;
  }
  select:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

  .input.color { padding-left: 4px; }
  .input.color input[type=color] {
    flex: none; width: 20px; height: 20px; padding: 0; border: 0;
    background: none; cursor: pointer;
  }
  .input.color input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .input.color input[type=color]::-webkit-color-swatch { border: 1px solid rgba(0,0,0,.15); border-radius: 3px; }
  .input.color input[type=color]::-moz-color-swatch { border: 1px solid rgba(0,0,0,.15); border-radius: 3px; }
  .input.color .hex { padding-left: 6px; color: var(--text); font-size: 12px; text-transform: uppercase; font-variant-numeric: tabular-nums; }

  /* link toggle for margins */
  .toggle { position: relative; display: inline-flex; }
  .toggle input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .toggle span {
    display: inline-flex; align-items: center; gap: 4px;
    font-weight: 400; font-size: 11px; color: var(--muted);
    padding: 2px 6px; border-radius: 4px;
  }
  .toggle span svg { width: 12px; height: 12px; }
  .toggle input:checked + span { color: var(--accent); background: #edf2fd; }
  .toggle input:focus-visible + span { box-shadow: 0 0 0 1px var(--accent); }

  .swatch { position: relative; display: inline-flex; cursor: pointer; }
  .swatch input[type=color] {
    width: 18px; height: 18px; padding: 0; border: 0; background: none; cursor: pointer;
  }
  .swatch input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .swatch input[type=color]::-webkit-color-swatch { border: 1px solid rgba(0,0,0,.15); border-radius: 3px; }
  .swatch input[type=color]::-moz-color-swatch { border: 1px solid rgba(0,0,0,.15); border-radius: 3px; }

  label.check { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  label.check input { margin: 0; accent-color: var(--accent); }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }

  .footer {
    margin-top: auto; padding: 12px 14px 14px;
    display: flex; flex-direction: column; gap: 8px;
    position: sticky; bottom: 0; background: var(--panel);
    border-top: 1px solid var(--line);
  }
  .info { color: var(--muted); font-variant-numeric: tabular-nums; }
  .info.warn { color: #c62828; }

  button {
    height: 28px;
    font: inherit; font-weight: 500;
    border-radius: 4px; cursor: pointer;
    color: var(--text); background: #fff;
    border: 1px solid var(--field-line);
    padding: 0 4px; white-space: nowrap;
  }
  button:hover { background: #f5f5f5; }
  button.primary { height: 30px; color: #fff; background: var(--accent); border-color: var(--accent); }
  button.primary:hover { background: var(--accent); filter: brightness(0.94); }
  button.ghost { border-color: transparent; background: transparent; padding: 0 8px; }
  button.ghost:hover { background: #f0f0f0; }
  button.ghost.on { color: var(--accent); background: #edf2fd; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- canvas area ---------- */
  main {
    flex: 1; min-width: 0; position: relative;
    display: flex; flex-direction: column;
  }
  .toolbar {
    height: 41px; flex: none;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0 8px 0 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .toolbar .info { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tools { display: flex; gap: 2px; flex: none; }
  .stage {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 32px;
  }
  canvas {
    display: block;
    outline: 1px solid rgba(0,0,0,.12);
    background:
      conic-gradient(#d6d6d6 25%, #fff 0 50%, #d6d6d6 0 75%, #fff 0) 0 0 / 12px 12px;
  }
  .status {
    flex: none;
    height: 26px; padding: 0 12px;
    display: flex; align-items: center; justify-content: flex-end; gap: 12px;
    color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums;
  }
  .toast {
    position: absolute; top: 53px; left: 50%;
    transform: translate(-50%, -6px);
    background: #222; color: #fff;
    padding: 6px 10px; border-radius: 4px;
    opacity: 0; pointer-events: none;
    transition: opacity .15s, transform .15s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* Google Slides guides panel */
  .sheet {
    position: absolute; top: 53px; right: 12px; bottom: 34px;
    width: 300px; max-width: calc(100% - 24px);
    background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .sheet[hidden] { display: none; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; }
  button.icon { width: 24px; height: 24px; padding: 0; border: 0; font-size: 18px; line-height: 1; color: var(--muted); }
  .note { margin: 0; color: var(--muted); }
  .sheet-cols { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-content: start; }
  .sheet h3 { font-size: 12px; margin: 0 0 6px; }
  .sheet h3 span { font-weight: 400; color: var(--muted); }
  .sheet ol { list-style: none; margin: 0; padding: 0; font-variant-numeric: tabular-nums; }
  .sheet li { display: flex; justify-content: space-between; gap: 6px; padding: 3px 0; border-bottom: 1px solid #f0f0f0; }
  .sheet li small { color: var(--muted); font-size: 11px; }

  @media (max-width: 720px) {
    body { flex-direction: column; height: auto; }
    aside { width: 100%; border-right: 0; border-bottom: 1px solid var(--line); }
    .footer { position: static; }
    main { min-height: 70vh; }
    .stage { padding: 16px; }
  }
</style>
</head>
<body>
  <aside>
    <div class="title">12col</div>

    <section>
      <div class="head">Canvas</div>
      <select id="preset" aria-label="Size preset">
        <option value="">Custom</option>
        <option value="1920x1080" selected>1920 × 1080</option>
        <option value="3840x2160">3840 × 2160</option>
        <option value="1280x720">1280 × 720</option>
        <option value="1080x1080">1080 × 1080</option>
        <option value="1080x1350">1080 × 1350</option>
        <option value="1080x1920">1080 × 1920</option>
      </select>
      <div class="grid2">
        <label class="input" title="Width"><span>W</span><input type="number" id="w" min="1" max="16384" value="1920"></label>
        <label class="input" title="Height"><span>H</span><input type="number" id="h" min="1" max="16384" value="1080"></label>
      </div>
    </section>

    <section>
      <div class="head">Grid</div>
      <div class="grid2">
        <label class="input" title="Columns"><span>Cols</span><input type="number" id="cols" min="0" max="500" value="12"></label>
        <label class="input" title="Gutter between columns"><span>Gutter</span><input type="number" id="gx" min="0" value="0"></label>
        <label class="input" title="Rows"><span>Rows</span><input type="number" id="rows" min="0" max="500" value="6"></label>
        <label class="input" title="Gutter between rows"><span>Gutter</span><input type="number" id="gy" min="0" value="0"></label>
      </div>
    </section>

    <section>
      <div class="head">
        Margins
        <label class="toggle" title="Use the same value for all sides">
          <input type="checkbox" id="link">
          <span>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6.5 9.5l3-3M7 4.5l1-1a2.5 2.5 0 013.5 3.5l-1 1M9 11.5l-1 1A2.5 2.5 0 014.5 9l1-1"/></svg>
            Link
          </span>
        </label>
      </div>
      <div class="grid2">
        <label class="input" title="Top"><span>T</span><input type="number" id="mt" min="0" value="80" data-margin></label>
        <label class="input" title="Bottom"><span>B</span><input type="number" id="mb" min="0" value="120" data-margin></label>
        <label class="input" title="Left"><span>L</span><input type="number" id="ml" min="0" value="80" data-margin></label>
        <label class="input" title="Right"><span>R</span><input type="number" id="mr" min="0" value="80" data-margin></label>
      </div>
    </section>

    <section>
      <div class="head">Style</div>
      <div class="grid2">
        <label class="input color" title="Line color"><input type="color" id="color" value="#ff0000"><span class="hex" data-hex="color"></span></label>
        <label class="input" title="Line thickness"><span>Px</span><input type="number" id="lw" min="0" max="50" value="1"></label>
        <select id="fill" aria-label="Fill" title="Tint columns, rows or cells with the line color">
          <option value="none" selected>No fill</option>
          <option value="columns">Fill columns</option>
          <option value="rows">Fill rows</option>
          <option value="cells">Fill cells</option>
        </select>
        <label class="input" title="Fill opacity"><span>Opacity</span><input type="number" id="fo" min="0" max="100" value="10"><span class="suffix">%</span></label>
      </div>
      <label class="check"><input type="checkbox" id="transparent"> Transparent background</label>
    </section>

    <section>
      <div class="head">
        Guides
        <label class="swatch" title="Guide color"><input type="color" id="color2" value="#0096ff" aria-label="Guide color"></label>
      </div>
      <div class="checks">
        <label class="check" title="Lines through the middle"><input type="checkbox" id="gCenter"> Center</label>
        <label class="check" title="Rule of thirds"><input type="checkbox" id="gThirds"> Thirds</label>
        <label class="check" title="Action safe area (93%)"><input type="checkbox" id="gAction"> Action safe</label>
        <label class="check" title="Title safe area (90%)"><input type="checkbox" id="gTitle"> Title safe</label>
      </div>
    </section>

    <div class="footer">
      <button id="download" class="primary">Export PNG</button>
      <div class="grid2">
        <button id="copyPng" title="Copy the grid as an image">Copy PNG</button>
        <button id="copySvg" title="Copy as vectors: paste into Figma or Illustrator">Copy SVG</button>
      </div>
    </div>
  </aside>

  <main>
    <div class="toolbar">
      <span class="info" id="info"></span>
      <div class="tools">
        <button id="slidesBtn" class="ghost" title="Guide positions in inches for Google Slides">Slides guides</button>
        <button id="copyLink" class="ghost" title="Copy a link to these settings">Copy link</button>
      </div>
    </div>
    <div class="stage" id="stage"><canvas id="canvas"></canvas></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="sheet" id="sheet" hidden>
      <div class="sheet-head">
        <strong>Google Slides guides</strong>
        <button id="sheetClose" class="icon" aria-label="Close">&times;</button>
      </div>
      <label class="input" title="Slide width in inches (File → Page setup in Slides)"><span>Slide width</span><input type="number" id="slideW" min="0.1" step="0.01" value="10"><span class="suffix">in</span></label>
      <p class="note" id="slideNote"></p>
      <div class="sheet-cols">
        <div><h3>Vertical <span>from left</span></h3><ol id="listX"></ol></div>
        <div><h3>Horizontal <span>from top</span></h3><ol id="listY"></ol></div>
      </div>
      <button id="copyInches">Copy list</button>
    </div>
    <div class="status"><span id="sizeTag"></span><span id="zoom"></span></div>
  </main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('canvas');
  const stage = $('stage');
  const fields = ['w', 'h', 'cols', 'rows', 'gx', 'gy', 'mt', 'mr', 'mb', 'ml', 'link',
                  'color', 'lw', 'transparent', 'fill', 'fo',
                  'gCenter', 'gThirds', 'gAction', 'gTitle', 'color2', 'slideW'];
  const STORE = '12col:v1';

  // ---- settings: snapshot / apply ----
  function snapshot() {
    const o = {};
    for (const k of fields) { const el = $(k); o[k] = el.type === 'checkbox' ? el.checked : el.value; }
    return o;
  }
  function apply(o) {
    for (const k of fields) {
      if (!(k in o)) continue;
      const el = $(k);
      if (el.type === 'checkbox') el.checked = !!o[k]; else el.value = o[k];
    }
  }
  const defaults = snapshot();

  // ---- shareable links: non-default settings live in the URL hash ----
  function toHash() {
    const cur = snapshot();
    const p = new URLSearchParams();
    for (const k of fields) {
      if (cur[k] === defaults[k]) continue;
      let v = cur[k];
      if (typeof v === 'boolean') v = v ? '1' : '0';
      else if (v.startsWith('#')) v = v.slice(1);
      p.set(k, v);
    }
    const q = p.toString();
    return q ? '#' + q : '';
  }
  function fromHash() {
    const h = location.hash.slice(1);
    if (!h) return null;
    const p = new URLSearchParams(h);
    const o = { ...defaults };
    for (const k of fields) {
      if (!p.has(k)) continue;
      const v = p.get(k), el = $(k);
      if (el.type === 'checkbox') o[k] = v === '1';
      else if (el.type === 'color') o[k] = /^[0-9a-f]{6}$/i.test(v) ? '#' + v.toLowerCase() : defaults[k];
      else o[k] = v;
    }
    return o;
  }

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(snapshot())); } catch (e) {}
    try { history.replaceState(null, '', location.pathname + location.search + toHash()); } catch (e) {}
  }

  const fromUrl = fromHash();
  if (fromUrl) apply(fromUrl);
  else {
    try {
      const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
      if (saved) apply(saved);
    } catch (e) {}
  }

  // ---- reading inputs ----
  const num = (id, min = 0, max = Infinity) => {
    const v = parseFloat($(id).value);
    return Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : min;
  };

  function read() {
    const fill = $('fill').value;
    return {
      w: Math.round(num('w', 1, 16384)),
      h: Math.round(num('h', 1, 16384)),
      cols: Math.round(num('cols', 0, 500)),
      rows: Math.round(num('rows', 0, 500)),
      gx: num('gx'), gy: num('gy'),
      mt: num('mt'), mr: num('mr'), mb: num('mb'), ml: num('ml'),
      lw: Math.round(num('lw', 0, 50)),
      color: $('color').value,
      transparent: $('transparent').checked,
      fill: ['columns', 'rows', 'cells'].includes(fill) ? fill : 'none',
      fo: num('fo', 0, 100) / 100,
      center: $('gCenter').checked,
      thirds: $('gThirds').checked,
      action: $('gAction').checked,
      title: $('gTitle').checked,
      color2: $('color2').value,
    };
  }

  // ---- geometry ----
  // Cell spans along one axis. 0 or 1 cells (or gutters that don't fit) = the whole content box.
  function spans(start, len, n, g) {
    if (n <= 1) return { list: [[start, start + len]], size: len };
    const size = (len - g * (n - 1)) / n;
    if (size <= 0) return { list: [[start, start + len]], size };
    const list = [];
    for (let i = 0; i < n; i++) { const a = start + i * (size + g); list.push([a, a + size]); }
    return { list, size };
  }

  function geometry(s) {
    const cw = s.w - s.ml - s.mr;
    const ch = s.h - s.mt - s.mb;
    const cx = spans(s.ml, cw, s.cols, s.gx);
    const ry = spans(s.mt, ch, s.rows, s.gy);
    return { cw, ch, ok: cw > 0 && ch > 0, colW: cx.size, rowH: ry.size, cols: cx.list, rows: ry.list };
  }

  // Build every shape at scale k (k = 1 for exports), snapped to whole pixels.
  // Lines are thin rects tagged v (vertical) or not, so the SVG can emit real <line>s.
  function build(s, k) {
    const W = Math.max(1, Math.round(s.w * k));
    const H = Math.max(1, Math.round(s.h * k));
    // Px 0 hides the grid lines; guides still draw at 1px so they stay usable.
    const lw = Math.max(1, Math.round(Math.max(1, s.lw) * k));
    const R = v => Math.round(v * k);
    const at = (p, max) => Math.min(max - lw, Math.max(0, Math.round(p * k - lw / 2)));
    const range = (a, b, max) => {
      const s0 = Math.max(0, R(a) - Math.floor(lw / 2));
      return [s0, Math.min(max, R(b) + Math.ceil(lw / 2)) - s0];
    };
    const g = geometry(s);
    const fills = [], grid = [], guides = [];

    if (g.ok) {
      // Every other column/row (checkerboard for cells) gets half the fill strength.
      const box = (x0, y0, x1, y1, alt) => ({ x: R(x0), y: R(y0), w: R(x1) - R(x0), h: R(y1) - R(y0), a: alt ? 0.5 : 1 });
      const top = s.mt, bottom = s.mt + g.ch, left = s.ml, right = s.ml + g.cw;
      if (s.fill === 'columns') g.cols.forEach(([a, b], i) => fills.push(box(a, top, b, bottom, i % 2)));
      if (s.fill === 'rows') g.rows.forEach(([a, b], j) => fills.push(box(left, a, right, b, j % 2)));
      if (s.fill === 'cells') g.cols.forEach(([a, b], i) => g.rows.forEach(([c, d], j) => fills.push(box(a, c, b, d, (i + j) % 2))));

      const xs = new Set(), ys = new Set();
      if (s.lw > 0) {
      for (const [a, b] of g.cols) { xs.add(at(a, W)); xs.add(at(b, W)); }
      for (const [a, b] of g.rows) { ys.add(at(a, H)); ys.add(at(b, H)); }
      for (const x of xs) grid.push({ x, y: 0, w: lw, h: H, v: true });
      for (const y of ys) grid.push({ x: 0, y, w: W, h: lw, v: false });
      }
    }

    const vline = (x, y0 = 0, y1 = s.h) => { const [y, h] = range(y0, y1, H); guides.push({ x: at(x, W), y, w: lw, h, v: true }); };
    const hline = (y, x0 = 0, x1 = s.w) => { const [x, w] = range(x0, x1, W); guides.push({ x, y: at(y, H), w, h: lw, v: false }); };
    const safe = f => {
      const ix = s.w * (1 - f) / 2, iy = s.h * (1 - f) / 2;
      vline(ix, iy, s.h - iy); vline(s.w - ix, iy, s.h - iy);
      hline(iy, ix, s.w - ix); hline(s.h - iy, ix, s.w - ix);
    };
    if (s.center) { vline(s.w / 2); hline(s.h / 2); }
    if (s.thirds) { vline(s.w / 3); vline(2 * s.w / 3); hline(s.h / 3); hline(2 * s.h / 3); }
    if (s.action) safe(0.93);
    if (s.title) safe(0.90);

    return { W, H, lw, fills, grid, guides };
  }

  function paint(cv, s, k) {
    const m = build(s, k);
    cv.width = m.W; cv.height = m.H;
    const c = cv.getContext('2d');
    c.clearRect(0, 0, m.W, m.H);
    if (!s.transparent) { c.fillStyle = '#ffffff'; c.fillRect(0, 0, m.W, m.H); }
    c.fillStyle = s.color;
    for (const r of m.fills) { c.globalAlpha = s.fo * r.a; c.fillRect(r.x, r.y, r.w, r.h); }
    c.globalAlpha = 1;
    for (const r of m.grid) c.fillRect(r.x, r.y, r.w, r.h);
    c.fillStyle = s.color2;
    for (const r of m.guides) c.fillRect(r.x, r.y, r.w, r.h);
  }

  function toSvg(s) {
    const m = build(s, 1);
    const half = m.lw / 2;
    const line = r => r.v
      ? `<line x1="${r.x + half}" y1="${r.y}" x2="${r.x + half}" y2="${r.y + r.h}"/>`
      : `<line x1="${r.x}" y1="${r.y + half}" x2="${r.x + r.w}" y2="${r.y + half}"/>`;
    const out = [`<svg xmlns="http://www.w3.org/2000/svg" width="${m.W}" height="${m.H}" viewBox="0 0 ${m.W} ${m.H}">`];
    if (!s.transparent) out.push(`<rect id="Background" width="${m.W}" height="${m.H}" fill="#ffffff"/>`);
    if (m.fills.length) out.push(`<g id="Fill" fill="${s.color}">${m.fills.map(r => `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill-opacity="${+(s.fo * r.a).toFixed(4)}"/>`).join('')}</g>`);
    if (m.grid.length) out.push(`<g id="Grid" stroke="${s.color}" stroke-width="${m.lw}">${m.grid.map(line).join('')}</g>`);
    if (m.guides.length) out.push(`<g id="Guides" stroke="${s.color2}" stroke-width="${m.lw}">${m.guides.map(line).join('')}</g>`);
    out.push('</svg>');
    return out.join('\n');
  }

  const fmt = v => (Math.round(v * 100) / 100).toString();
  const fmt3 = v => (Math.round(v * 1000) / 1000).toString();

  function draw() {
    const s = read();
    const g = geometry(s);
    const info = $('info');
    if (!g.ok) {
      info.className = 'info warn';
      info.textContent = 'Margins are larger than the canvas.';
    } else if ((s.cols > 1 && g.colW <= 0) || (s.rows > 1 && g.rowH <= 0)) {
      info.className = 'info warn';
      info.textContent = 'Gutters don’t fit — lower the gutter or the count.';
    } else {
      info.className = 'info';
      info.textContent =
        (s.cols > 0 ? `Column ${fmt(g.colW)}px` : 'No columns') + ' · ' +
        (s.rows > 0 ? `Row ${fmt(g.rowH)}px` : 'No rows');
    }
    document.querySelectorAll('[data-hex]').forEach(el => { el.textContent = $(el.dataset.hex).value.replace('#', ''); });
    $('sizeTag').textContent = `${s.w} × ${s.h}`;
    fit();
    renderSheet();
    save();
  }

  // ---- Google Slides guide positions (inches from the slide's top-left) ----
  function slideStops(s) {
    const g = geometry(s);
    const xs = [], ys = [];
    if (g.ok) {
      for (const [a, b] of g.cols) xs.push([a, ''], [b, '']);
      for (const [a, b] of g.rows) ys.push([a, ''], [b, '']);
    }
    if (s.center) { xs.push([s.w / 2, 'center']); ys.push([s.h / 2, 'center']); }
    if (s.thirds) { xs.push([s.w / 3, 'thirds'], [2 * s.w / 3, 'thirds']); ys.push([s.h / 3, 'thirds'], [2 * s.h / 3, 'thirds']); }
    const safe = (f, tag) => {
      const ix = s.w * (1 - f) / 2, iy = s.h * (1 - f) / 2;
      xs.push([ix, tag], [s.w - ix, tag]); ys.push([iy, tag], [s.h - iy, tag]);
    };
    if (s.action) safe(0.93, 'action safe');
    if (s.title) safe(0.90, 'title safe');

    const inPerPx = num('slideW', 0.1, 1000) / s.w;
    const list = arr => {
      const seen = new Map();
      for (const [px, tag] of arr.sort((a, b) => a[0] - b[0])) {
        const inch = (px * inPerPx).toFixed(2);
        if (!seen.has(inch)) seen.set(inch, { inch, px, tag });
        else if (!seen.get(inch).tag) seen.get(inch).tag = tag;
      }
      return [...seen.values()];
    };
    return { x: list(xs), y: list(ys), slideH: s.h * inPerPx, slideW: s.w * inPerPx };
  }

  function renderSheet() {
    if ($('sheet').hidden) return;
    const st = slideStops(read());
    const row = e => `<li><span>${e.inch}</span><small>${e.tag || fmt(e.px) + 'px'}</small></li>`;
    $('listX').innerHTML = st.x.map(row).join('');
    $('listY').innerHTML = st.y.map(row).join('');
    $('slideNote').textContent =
      `Slide is ${fmt3(st.slideW)} × ${fmt3(st.slideH)} in. Match it in Slides under File → Page setup.`;
  }

  const showSheet = open => {
    $('sheet').hidden = !open;
    $('slidesBtn').classList.toggle('on', open);
    renderSheet();
  };
  $('slidesBtn').addEventListener('click', () => showSheet($('sheet').hidden));
  $('sheetClose').addEventListener('click', () => showSheet(false));
  $('slideW').addEventListener('input', () => { renderSheet(); save(); });
  $('copyInches').addEventListener('click', () => copy('List', () => {
    const st = slideStops(read());
    const lines = e => e.inch + (e.tag ? ` (${e.tag})` : '');
    const text = [`Slide ${fmt3(st.slideW)} x ${fmt3(st.slideH)} in`, '',
      'Vertical guides (inches from left)', ...st.x.map(lines), '',
      'Horizontal guides (inches from top)', ...st.y.map(lines)].join('\n');
    return navigator.clipboard.writeText(text);
  }));

  // Preview is drawn at on-screen resolution so thin lines never vanish when scaled down.
  function fit() {
    const s = read();
    const cs = getComputedStyle(stage);
    const availW = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const availH = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const scale = Math.max(0.01, Math.min(availW / s.w, availH / s.h, 1));
    const dpr = window.devicePixelRatio || 1;
    paint(canvas, s, Math.min(1, scale * dpr));
    canvas.style.width = Math.max(1, s.w * scale) + 'px';
    canvas.style.height = Math.max(1, s.h * scale) + 'px';
    $('zoom').textContent = Math.round(scale * 100) + '%';
  }

  // ---- toast ----
  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
  }

  // ---- export / copy ----
  function fileName(s, ext) {
    const gut = s.gx === s.gy ? fmt(s.gx) : `${fmt(s.gx)}x${fmt(s.gy)}`;
    return `12col-${s.w}x${s.h}-${s.cols}c-${s.rows}r-${gut}g.${ext}`;
  }

  function fullSize() {
    const out = document.createElement('canvas');
    paint(out, read(), 1);
    return out;
  }

  async function copy(label, fn) {
    if (!navigator.clipboard || !window.isSecureContext) { toast('Copying needs HTTPS'); return; }
    try { await fn(); toast(`${label} copied`); }
    catch (e) { toast(`Couldn’t copy ${label}`); }
  }

  $('download').addEventListener('click', () => {
    const name = fileName(read(), 'png');
    fullSize().toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, 'image/png');
  });

  // The ClipboardItem gets a promise so Safari keeps the click's permission while the PNG encodes.
  $('copyPng').addEventListener('click', () => copy('PNG', () => {
    const out = fullSize();
    return navigator.clipboard.write([
      new ClipboardItem({ 'image/png': new Promise(res => out.toBlob(res, 'image/png')) }),
    ]);
  }));
  $('copySvg').addEventListener('click', () => copy('SVG', () => navigator.clipboard.writeText(toSvg(read()))));
  $('copyLink').addEventListener('click', () => copy('Link', () => navigator.clipboard.writeText(location.href)));

  // ---- wiring ----
  const margins = [...document.querySelectorAll('[data-margin]')];
  margins.forEach(el => el.addEventListener('input', () => {
    if ($('link').checked) margins.forEach(o => { if (o !== el) o.value = el.value; });
  }));
  $('link').addEventListener('change', () => {
    if ($('link').checked) { margins.forEach(o => o.value = $('mt').value); draw(); }
  });

  $('preset').addEventListener('change', () => {
    const v = $('preset').value;
    if (!v) return;
    const [w, h] = v.split('x');
    $('w').value = w; $('h').value = h;
    draw();
  });
  const syncPreset = () => {
    const key = `${$('w').value}x${$('h').value}`;
    $('preset').value = [...$('preset').options].some(o => o.value === key) ? key : '';
  };
  $('w').addEventListener('input', syncPreset);
  $('h').addEventListener('input', syncPreset);

  document.querySelectorAll('aside input, #fill').forEach(el => el.addEventListener('input', draw));
  window.addEventListener('hashchange', () => { apply(fromHash() || defaults); syncPreset(); draw(); });
  new ResizeObserver(fit).observe(stage);

  syncPreset();
  draw();
})();
</script>
</body>
</html>
